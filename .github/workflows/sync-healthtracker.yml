# Keeps public/healthtracker/ in step with landing/ on health-tracker's main branch.
name: Sync Health Tracker landing

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-healthtracker
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch the landing from health-tracker
        id: fetch
        run: |
          git clone -q --depth 1 --filter=blob:none --sparse https://github.com/deluispablo/health-tracker /tmp/ht
          git -C /tmp/ht sparse-checkout set landing
          if [ -f /tmp/ht/landing/index.html ]; then
            echo "found=true" >> "$GITHUB_OUTPUT"
          else
            echo "landing/ is not on main yet; nothing to sync."
            echo "found=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit when it changed
        if: steps.fetch.outputs.found == 'true'
        run: |
          rsync -a --delete /tmp/ht/landing/ public/healthtracker/
          git add -A public/healthtracker
          if git diff --cached --quiet; then
            echo "Already up to date."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "chore(healthtracker): sync the landing from health-tracker"
          git push
